name: bash

# Builds GNU bash for Intel Macs (darwin/amd64) from a release tarball plus
# its official patches (macOS itself only ships bash 3.2 and upstream
# publishes no binaries). C with autoconf, so it needs a real macOS SDK: runs
# natively on an Intel runner.
#
# The base version and patch level are pinned below and bumped by Renovate
# (custom datasources reading the ftp.gnu.org listings, see renovate.json).
# Its PR runs this as a build-only check (gating automerge); the merge to main
# builds again and publishes a release tagged "bash/<X.Y>.<patchlevel>",
# e.g. bash/5.3.20 -- the same triple bash reports in BASH_VERSINFO.
on:
  push:
    branches: [main]
    paths: [.github/workflows/bash.yml]
  pull_request:
    paths: [.github/workflows/bash.yml]
  workflow_dispatch:

env:
  GNU: https://ftp.gnu.org/gnu/bash
  # renovate: datasource=custom.gnu-bash depName=bash
  BASH_BASE: "5.3"
  # When BASH_BASE changes, reset this to "000" and set packageName to the
  # new base in the same PR -- patches belong to one base version.
  # renovate: datasource=custom.gnu-bash-patches depName=bash-patches packageName=5.3
  BASH_PATCHLEVEL: "020"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26-intel
    steps:
      # PRs always build (that's the check); pushes skip if already released,
      # e.g. when only an action version changed
      - name: Check release
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$BASH_BASE.$((10#$BASH_PATCHLEVEL))"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" != pull_request ] && gh release view "bash/$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "bash/$version already released, nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # verify the tarball and every patch against GNU's keyring before use
      - name: Download and verify sources
        if: steps.ver.outputs.skip != 'true'
        run: |
          curl -fsSLO https://ftp.gnu.org/gnu/gnu-keyring.gpg
          verify() { curl -fsSLO "$1" && curl -fsSLO "$1.sig" && gpgv --keyring "$GITHUB_WORKSPACE/gnu-keyring.gpg" "$(basename "$1").sig" "$(basename "$1")"; }
          verify "$GNU/bash-$BASH_BASE.tar.gz"
          mkdir patches
          for ((i = 1; i <= 10#$BASH_PATCHLEVEL; i++)); do
            p=$(printf 'bash%s-%03d' "${BASH_BASE//./}" "$i")
            echo "$p" >> patches.txt
            (cd patches && verify "$GNU/bash-$BASH_BASE-patches/$p")
          done
          touch patches.txt

      - name: Apply patches
        if: steps.ver.outputs.skip != 'true'
        run: |
          tar xzf "bash-$BASH_BASE.tar.gz"
          cd "bash-$BASH_BASE"
          while read -r p; do
            patch -p0 --forward --batch < "../patches/$p"
          done < ../patches.txt

      - name: Build
        if: steps.ver.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          cd "bash-$BASH_BASE"
          # the runner has Homebrew in /usr/local (on the default search path):
          # no NLS so its libintl isn't picked up, and use the system libiconv
          ./configure --prefix=/usr/local --disable-nls --without-libiconv-prefix --without-libintl-prefix
          make -j"$(sysctl -n hw.ncpu)"
          file bash
          otool -L bash
          # smoke test: right version, and a few bash-4+/5 features work
          ./bash --version | head -1
          ./bash -c '[ "${BASH_VERSINFO[0]}.${BASH_VERSINFO[1]}.${BASH_VERSINFO[2]}" = "$1" ]' _ "$VERSION"
          ./bash -ec 'declare -A m=([k]=v); [[ ${m[k]} == v ]]; s=Ab; [[ ${s,,} == ab ]]; mapfile -t a < <(printf "1\n2\n"); (( ${#a[@]} == 2 ))'
          # only system libraries may be linked (no Homebrew/MacPorts leakage)
          if otool -L bash | tail -n +2 | grep -vE '^[[:space:]]*(/usr/lib/|/System/Library/)'; then
            echo "::error::bash links non-system libraries (above)"; exit 1
          fi
          tar czf ../bash-darwin-amd64.tar.gz bash
          cd ..
          shasum -a 256 bash-darwin-amd64.tar.gz > bash-darwin-amd64.tar.gz.sha256

      - name: Release
        if: steps.ver.outputs.skip != 'true' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          gh release create "bash/$VERSION" \
            bash-darwin-amd64.tar.gz bash-darwin-amd64.tar.gz.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "bash $VERSION (darwin/amd64)" \
            --latest=false \
            --notes "Unofficial GNU bash build for Intel Macs: [bash-$BASH_BASE.tar.gz]($GNU/bash-$BASH_BASE.tar.gz) plus official patches up to $VERSION ([patches]($GNU/bash-$BASH_BASE-patches/)), GPG-verified against the GNU keyring. Built natively on \`macos-26-intel\`."
